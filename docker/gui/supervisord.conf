; Processes of the gui container: X server with VNC, window manager,
; noVNC web client, RViz and Gazebo GUI.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:xvnc]
command=Xvnc %(ENV_DISPLAY)s -geometry %(ENV_VNC_RESOLUTION)s -depth 24 -rfbport 5901 -SecurityTypes None -AlwaysShared -localhost
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=openbox
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5901
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; small sleep so that the X server is up before the GUI apps are starting
[program:rviz]
command=bash -c "sleep 3 && exec rviz2 -d %(ENV_RVIZ_CONFIG)s --ros-args -p use_sim_time:=true"
priority=30
autostart=%(ENV_START_RVIZ)s
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:gazebo]
command=bash -c "sleep 3 && exec gz sim -g -v 2"
priority=30
autostart=%(ENV_START_GZ_GUI)s
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Gazebo camera follows the vehicle, from behind and a bit above. The GUI takes
; some time to come up, so it waits for the follow service first.
[program:gazebo_follow]
command=bash -c "until gz service -l 2>/dev/null | grep -q /gui/follow; do sleep 2; done; sleep 3; gz service -s /gui/follow --reqtype gz.msgs.StringMsg --reptype gz.msgs.Boolean --timeout 3000 --req 'data: \"auv\"' && gz service -s /gui/follow/offset --reqtype gz.msgs.Vector3d --reptype gz.msgs.Boolean --timeout 3000 --req 'x: -7, y: -3, z: 3'"
priority=40
autostart=%(ENV_START_GZ_GUI)s
autorestart=unexpected
exitcodes=0
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
