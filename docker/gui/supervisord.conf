; Processes of the gui container: X server with VNC, window manager,
; noVNC web client, RViz and Gazebo GUI.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:xvnc]
command=Xvnc %(ENV_DISPLAY)s -geometry %(ENV_VNC_RESOLUTION)s -depth 24 -rfbport 5901 -SecurityTypes None -AlwaysShared -localhost
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=openbox
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5901
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; small sleep so that the X server is up before the GUI apps are starting
[program:rviz]
command=bash -c "sleep 3 && exec rviz2 -d %(ENV_RVIZ_CONFIG)s --ros-args -p use_sim_time:=true"
priority=30
autostart=%(ENV_START_RVIZ)s
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:gazebo]
command=bash -c "sleep 3 && exec gz sim -g -v 2"
priority=30
autostart=%(ENV_START_GZ_GUI)s
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
