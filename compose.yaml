name: auv-slam-sim

# One service = one ROS 2 node (or one tightly coupled process).
# All of them sit on auv_net and discover each other through the zenoh router.
# Settings are coming from .env (copy from .env.example), defaults below are used if it is missing.

x-ros-env: &ros-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_zenoh_cpp}
  # by default sessions look for the router on localhost and listen only on localhost.
  # point them to the router container and listen on all interfaces so peers connect directly
  ZENOH_CONFIG_OVERRIDE: 'connect/endpoints=["tcp/zenoh-router:7447"];listen/endpoints=["tcp/[::]:0"]'

# gazebo transport is separate from ROS 2, same partition is needed in every
# container which talks to the simulator directly (sim, bridge, gui)
x-gz-env: &gz-env
  GZ_PARTITION: ${GZ_PARTITION:-auv_sim}

x-ros-build: &ros-build
  context: .
  dockerfile: docker/Dockerfile
  target: base
  args:
    ROS_DISTRO: ${ROS_DISTRO:-jazzy}

x-ros-node: &ros-node
  image: auv-slam-sim/base:${ROS_DISTRO:-jazzy}
  build: *ros-build
  environment: *ros-env
  networks: [auv_net]
  depends_on:
    zenoh-router:
      condition: service_healthy
  restart: unless-stopped

# Nodes running on simulation time. If the simulator is restarted the clock goes
# back to zero and these nodes get stuck (EKF stops publishing), so compose is
# told to restart them along with the simulator.
x-sim-node: &sim-node
  <<: *ros-node
  depends_on:
    zenoh-router:
      condition: service_healthy
    sim:
      condition: service_healthy
      restart: true

services:
  zenoh-router:
    <<: *ros-node
    command: ros2 run rmw_zenoh_cpp rmw_zenohd
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_zenoh_cpp}
    depends_on: []
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/7447"]
      interval: 2s
      timeout: 2s
      retries: 15

  # --- simulator ------------------------------------------------------------
  sim:
    <<: *ros-node
    image: auv-slam-sim/sim:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: sim
    environment:
      <<: [*ros-env, *gz-env]
    command: ros2 launch auv_sim sim.launch.py
    healthcheck:
      test: ["CMD", "pgrep", "-f", "gz sim"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  bridge:
    <<: *sim-node
    image: auv-slam-sim/sim:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: sim
    environment:
      <<: [*ros-env, *gz-env]
    command: ros2 launch auv_sim bridge.launch.py

  # --- simulated navigation sensors (sonar and raw IMU are coming from gazebo) ---
  ahrs:
    <<: *sim-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    command: ros2 launch auv_sensors sensor.launch.py node:=ahrs

  dvl:
    <<: *sim-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    command: ros2 launch auv_sensors sensor.launch.py node:=dvl

  depth:
    <<: *sim-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    command: ros2 launch auv_sensors sensor.launch.py node:=depth

  # GPS, fix only at the surface
  gps:
    <<: *sim-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    command: ros2 launch auv_sensors sensor.launch.py node:=gps

  # USBL fixes from the support ship
  usbl:
    <<: *sim-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    command: ros2 launch auv_sensors sensor.launch.py node:=usbl

  # --- survey sonars: across track fan -> multibeam swath / submaps, sidescan ---
  multibeam:
    <<: *sim-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    command: ros2 launch auv_sonar sonar.launch.py node:=multibeam

  swath-assembler:
    <<: *sim-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    command: ros2 launch auv_sonar sonar.launch.py node:=swath_assembler

  sidescan:
    <<: *sim-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    command: ros2 launch auv_sonar sonar.launch.py node:=sidescan

  # --- control: setpoints / cmd_vel -> controller -> propeller and fins -------
  controller:
    <<: *sim-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    command: ros2 launch auv_control control.launch.py node:=controller

  # --- localization: AHRS + DVL + depth -> odom -> base_link -------------------
  localization:
    <<: *sim-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    # ground truth frame is attached to map, SLAM is giving map -> odom
    command: ros2 launch auv_localization localization.launch.py world_child_frame:=map

  # --- SLAM: sonar cloud + odom -> map -> odom and the 3D map -------------------
  slam:
    <<: *sim-node
    image: auv-slam-sim/slam:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: slam
    command: ros2 launch auv_slam slam.launch.py
    volumes:
      - slam_data:/data

  # --- mission: survey waypoints -> cmd_vel and setpoints for the controller ---
  mission:
    <<: *sim-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    command: ros2 launch auv_mission mission.launch.py

  # estimate against ground truth, simulation only
  eval:
    <<: *sim-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    command: ros2 launch auv_eval eval.launch.py

  # --- vehicle ---------------------------------------------------------------
  state-pub:
    <<: *sim-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    command: ros2 launch auv_description state_publisher.launch.py

  # --- visualisation --------------------------------------------------------
  # desktop in the browser with RViz and Gazebo GUI: http://localhost:6080
  gui:
    <<: *sim-node
    image: auv-slam-sim/gui:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: gui
    environment:
      <<: [*ros-env, *gz-env]
      VNC_RESOLUTION: ${VNC_RESOLUTION:-1600x900}
      START_RVIZ: ${START_RVIZ:-true}
      START_GZ_GUI: ${START_GZ_GUI:-true}
    ports:
      # no password on the VNC, so it is kept on localhost only
      - "127.0.0.1:${NOVNC_PORT:-6080}:6080"
    shm_size: 512m
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/6080"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # live data for Foxglove: ws://localhost:8765
  foxglove:
    <<: *sim-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    command: >
      ros2 run foxglove_bridge foxglove_bridge --ros-args
      -p port:=8765 -p address:=0.0.0.0 -p use_sim_time:=true
    ports:
      - "127.0.0.1:${FOXGLOVE_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8765"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # rosbag recording, started with `make bag`. Bags are kept in ./bags
  bag:
    <<: *ros-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    profiles: [tools]
    restart: "no"
    working_dir: /bags
    volumes:
      - ./bags:/bags
    command: >
      ros2 bag record --use-sim-time --topics
      /clock /tf /tf_static /robot_description
      /sonar/points /imu/raw /imu/data /dvl/twist /dvl/altitude /depth/pose /pressure
      /gps/fix /gps/pose /usbl/pose /usbl/ship /speed_model/twist
      /multibeam/swath /multibeam/submap /sidescan/waterfall
      /cmd_vel /speed_setpoint /depth_setpoint /heading_setpoint /altitude_setpoint
      /propeller/cmd_thrust /fins/rudder/cmd_angle /fins/elevator/cmd_angle
      /controller/speed_reference /controller/heading_reference
      /controller/depth_reference /controller/pitch_reference
      /odometry/filtered /ground_truth/odom
      /mission/status /mission/path
      /eval/ekf_position_error /eval/slam_position_error /eval/depth_error
      /eval/heading_error_deg /eval/distance_travelled

  # keyboard teleop, started with `make teleop`
  teleop:
    <<: *ros-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    profiles: [tools]
    restart: "no"
    stdin_open: true
    tty: true
    command: ros2 run auv_teleop keyboard_node

  # --- throwaway shell on the network, for ros2 topic/node commands ----------
  shell:
    <<: *ros-node
    profiles: [tools]
    restart: "no"
    command: bash

  # --- smoke test: two containers talking to each other ---------------------
  talker:
    <<: *ros-node
    profiles: [smoke]
    command: ros2 run demo_nodes_cpp talker

  listener:
    <<: *ros-node
    profiles: [smoke]
    command: ros2 run demo_nodes_cpp listener

volumes:
  # RTAB-Map database, the map can be opened later with rtabmap-databaseViewer
  slam_data:

networks:
  auv_net:
    driver: bridge
