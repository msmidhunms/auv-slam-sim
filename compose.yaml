name: auv-slam-sim

# One service = one ROS 2 node (or one tightly coupled process).
# All of them sit on auv_net and discover each other through the zenoh router.
# Settings are coming from .env (copy from .env.example), defaults below are used if it is missing.

x-ros-env: &ros-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_zenoh_cpp}
  # by default sessions look for the router on localhost and listen only on localhost.
  # point them to the router container and listen on all interfaces so peers connect directly
  ZENOH_CONFIG_OVERRIDE: 'connect/endpoints=["tcp/zenoh-router:7447"];listen/endpoints=["tcp/[::]:0"]'

# gazebo transport is separate from ROS 2, same partition is needed in every
# container which talks to the simulator directly (sim, bridge, gui)
x-gz-env: &gz-env
  GZ_PARTITION: ${GZ_PARTITION:-auv_sim}

x-ros-build: &ros-build
  context: .
  dockerfile: docker/Dockerfile
  target: base
  args:
    ROS_DISTRO: ${ROS_DISTRO:-jazzy}

x-ros-node: &ros-node
  image: auv-slam-sim/base:${ROS_DISTRO:-jazzy}
  build: *ros-build
  environment: *ros-env
  networks: [auv_net]
  depends_on:
    zenoh-router:
      condition: service_healthy
  restart: unless-stopped

services:
  zenoh-router:
    <<: *ros-node
    command: ros2 run rmw_zenoh_cpp rmw_zenohd
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_zenoh_cpp}
    depends_on: []
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/7447"]
      interval: 2s
      timeout: 2s
      retries: 15

  # --- simulator ------------------------------------------------------------
  sim:
    <<: *ros-node
    image: auv-slam-sim/sim:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: sim
    environment:
      <<: [*ros-env, *gz-env]
    command: ros2 launch auv_sim sim.launch.py

  bridge:
    <<: *ros-node
    image: auv-slam-sim/sim:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: sim
    environment:
      <<: [*ros-env, *gz-env]
    command: ros2 launch auv_sim bridge.launch.py

  # --- simulated navigation sensors (sonar and raw IMU are coming from gazebo) ---
  ahrs:
    <<: *ros-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    command: ros2 launch auv_sensors sensor.launch.py node:=ahrs

  dvl:
    <<: *ros-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    command: ros2 launch auv_sensors sensor.launch.py node:=dvl

  depth:
    <<: *ros-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    command: ros2 launch auv_sensors sensor.launch.py node:=depth

  # --- control: cmd_vel -> controller -> wrench -> allocator -> thrusters ------
  controller:
    <<: *ros-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    command: ros2 launch auv_control control.launch.py node:=controller

  allocator:
    <<: *ros-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    command: ros2 launch auv_control control.launch.py node:=thruster_allocator

  # --- vehicle ---------------------------------------------------------------
  state-pub:
    <<: *ros-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    command: ros2 launch auv_description state_publisher.launch.py

  # --- visualisation --------------------------------------------------------
  # desktop in the browser with RViz and Gazebo GUI: http://localhost:6080
  gui:
    <<: *ros-node
    image: auv-slam-sim/gui:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: gui
    environment:
      <<: [*ros-env, *gz-env]
      VNC_RESOLUTION: ${VNC_RESOLUTION:-1600x900}
      START_RVIZ: ${START_RVIZ:-true}
      START_GZ_GUI: ${START_GZ_GUI:-true}
    ports:
      # no password on the VNC, so it is kept on localhost only
      - "127.0.0.1:${NOVNC_PORT:-6080}:6080"
    shm_size: 512m

  # live data for Foxglove: ws://localhost:8765
  foxglove:
    <<: *ros-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    build:
      <<: *ros-build
      target: nodes
    command: >
      ros2 run foxglove_bridge foxglove_bridge --ros-args
      -p port:=8765 -p address:=0.0.0.0 -p use_sim_time:=true
    ports:
      - "127.0.0.1:${FOXGLOVE_PORT:-8765}:8765"

  # keyboard teleop, started with `make teleop`
  teleop:
    <<: *ros-node
    image: auv-slam-sim/nodes:${ROS_DISTRO:-jazzy}
    profiles: [tools]
    restart: "no"
    stdin_open: true
    tty: true
    command: ros2 run auv_teleop keyboard_node

  # --- throwaway shell on the network, for ros2 topic/node commands ----------
  shell:
    <<: *ros-node
    profiles: [tools]
    restart: "no"
    command: bash

  # --- smoke test: two containers talking to each other ---------------------
  talker:
    <<: *ros-node
    profiles: [smoke]
    command: ros2 run demo_nodes_cpp talker

  listener:
    <<: *ros-node
    profiles: [smoke]
    command: ros2 run demo_nodes_cpp listener

networks:
  auv_net:
    driver: bridge
