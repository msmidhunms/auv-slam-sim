# Torpedo AUV controller (MBARI Tethys LRAUV class vehicle).
#
# Fin gains are for the nominal speed and are scaled with (nominal / speed)^2,
# since the fin force goes with speed square. Angles are in rad.

controller:
  ros__parameters:
    enabled: true

    max_speed: 1.6              # m/s
    setpoint_timeout: 5.0       # s, propeller is stopped if no command is coming
    dvl_timeout: 1.0            # s

    # speed from the propeller command, for dead reckoning without DVL lock
    speed_model_time_constant: 10.0   # s
    speed_model_std: 0.15             # m/s

    nominal_speed: 1.0          # m/s, fin gains are tuned at this speed
    min_speed: 0.4              # m/s, below this the gain schedule is clipped
    max_schedule: 4.0

    # thrust feed forward, same as the hull drag in the vehicle model
    drag_linear: 1.0
    drag_quadratic: 6.2282
    min_thrust: -10.0           # N
    max_thrust: 20.0            # N

    max_depth: 45.0             # m
    max_pitch_deg: 25.0         # pitch reference limit while changing depth
    fin_limit: 0.26             # rad, mechanical limit is 15 deg

    speed:                      # thrust in N from speed error in m/s
      kp: 8.0
      ki: 4.0
      kd: 0.0
      integral_limit: 6.0
      output_limit: 10.0
    heading:                    # rudder in rad from heading error in rad
      kp: 0.35
      ki: 0.01
      kd: 0.8
      integral_limit: 0.05
      output_limit: 0.26
      integral_zone: 0.2
    depth:                      # pitch reference in rad from depth error in m
      kp: 0.12
      ki: 0.02
      kd: 0.5
      integral_limit: 0.15
      output_limit: 0.45
      integral_zone: 0.5          # m, integral only near the target, avoids overshoot on long dives
    pitch:                      # elevator in rad from pitch error in rad
      kp: 0.8
      ki: 0.2
      kd: 0.8
      integral_limit: 0.15
      output_limit: 0.26
