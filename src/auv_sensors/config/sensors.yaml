# Noise models of the simulated navigation sensors.
# Values are typical for the class of sensors used on a small ROV.

ahrs:
  ros__parameters:
    # white noise on the attitude output, deg
    roll_pitch_noise_std_deg: 0.1
    yaw_noise_std_deg: 0.3
    # magnetic heading error, modelled as a slowly wandering bias (Gauss-Markov)
    yaw_bias_std_deg: 1.5
    yaw_bias_time_constant: 300.0   # s
    # these two are only for the covariance fields, noise itself is added in gazebo
    gyro_noise_std: 0.002           # rad/s
    accel_noise_std: 0.02           # m/s^2
    seed: 11

dvl:
  ros__parameters:
    # 1200 kHz class DVL, bottom lock up to 30 m altitude. At the surface the
    # seabed is 34 to 46 m below, so the lock comes only during the dive.
    rate: 10.0                      # Hz
    noise_std: 0.01                 # m/s, per axis
    scale_error: 0.002              # 0.2 % of the speed
    dropout_probability: 0.02       # pings with no bottom lock even in range
    beam_angle_deg: 30.0            # Janus beams, from the vertical
    min_range: 0.5                  # m
    max_range: 30.0                 # m, slant range of a beam
    frame_id: dvl_link
    # DVL position in base_link, it measures the velocity at this point
    offset: [0.3, 0.0, -0.15]
    seed: 12

depth:
  ros__parameters:
    rate: 25.0                      # Hz, ground truth is at 50 Hz so keep it a divisor of 50
    noise_std: 0.01                 # m
    # depth/pose in odom (local EKF) and depth/pose_map in map (global EKF)
    world_frames: [odom, map]
    frame_id: base_link
    water_density: 1000.0           # kg/m^3
    atmospheric_pressure: 101325.0  # Pa
    seed: 13

gps:
  ros__parameters:
    rate: 1.0                       # Hz
    noise_std: 2.5                  # m, horizontal, per axis
    time_to_fix: 10.0               # s at the surface before the first fix
    surface_z: -0.3                 # m, antenna is out of water above this
    # datum of the local map frame: Moss Landing, Monterey Bay (MBARI)
    datum_latitude: 36.8023
    datum_longitude: -121.8995
    frame_id: gps_link
    seed: 14

usbl:
  ros__parameters:
    interval: 5.0                   # s between pings
    ship_position: [-20.0, -20.0, 0.0]   # m, support ship in the map frame
    relative_error: 0.005           # 0.5 % of slant range, 1 sigma per axis
    min_error: 0.2                  # m
    processing_time: 0.4            # s, on top of the two way sound travel
    dropout_probability: 0.1
    max_range: 1000.0               # m
    seed: 15

battery:
  ros__parameters:
    capacity_wh: 1000.0             # Wh, Li-ion pack
    hotel_load_w: 25.0              # W, computers, nav sensors and sonars
    propulsion_efficiency: 0.4      # thrust x speed / electrical power
    voltage_full: 33.6              # V, 8s Li-ion
    voltage_empty: 25.0
    initial_charge: 1.0
