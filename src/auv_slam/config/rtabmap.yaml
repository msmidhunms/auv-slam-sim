# RTAB-Map, bathymetric SLAM on the multibeam submaps.
#
# Odometry for RTAB-Map is the aided navigation (map -> base_link from the
# global EKF, which has USBL and GPS in it), so the graph is already close to
# the truth. A node is made for every submap (15 m of track, 35 to 40 m wide),
# and the submap of a new node is matched with ICP against the submaps of older
# nodes nearby (proximity detection). Bathymetry looks the same from any
# heading, so neighbouring survey lanes run in opposite direction also match.
# The correction comes out as the slam_map -> map TF.
#
# There is no camera, so appearance based loop closure is switched off.
# RTAB-Map internal parameters (Xxx/Yyy) are strings.

# node is running as /rtabmap/rtabmap, wildcard is used so the namespace does not matter
/**:
  ros__parameters:
    frame_id: base_link
    odom_frame_id: map              # aided navigation is the odometry here
    map_frame_id: slam_map
    publish_tf: true
    wait_for_transform: 0.5
    tf_delay: 0.05

    subscribe_depth: false
    subscribe_rgb: false
    subscribe_rgbd: false
    subscribe_scan: false
    subscribe_scan_cloud: true
    approx_sync: false
    sync_queue_size: 10

    # uncertainty of the navigation between two nodes (15 m apart), around
    # 0.3 m and 1 deg with USBL aiding
    odom_tf_linear_variance: 0.09
    odom_tf_angular_variance: 0.0003

    database_path: /data/rtabmap.db

    # --- graph and memory ---
    Rtabmap/DetectionRate: "1"          # Hz, submaps come much slower anyway
    Rtabmap/TimeThr: "0"
    RGBD/LinearUpdate: "5"              # m, so every submap gives a node
    RGBD/AngularUpdate: "0.5"           # rad
    RGBD/CreateOccupancyGrid: "true"
    Mem/STMSize: "10"
    Mem/NotLinkedNodesKept: "false"
    Kp/MaxFeatures: "-1"                # no visual features

    # --- registration: ICP between submaps ---
    Reg/Strategy: "1"                   # 0 visual, 1 ICP
    Reg/Force3DoF: "false"
    RGBD/NeighborLinkRefining: "false"  # navigation is already aided, no need
    RGBD/ProximityBySpace: "true"
    RGBD/ProximityByTime: "false"
    RGBD/ProximityMaxGraphDepth: "0"
    RGBD/ProximityPathMaxNeighbors: "1"
    RGBD/LocalRadius: "25"              # m, search radius for older submaps
    RGBD/OptimizeMaxError: "4"

    Icp/Strategy: "1"                   # libpointmatcher
    Icp/VoxelSize: "0.5"
    Icp/PointToPlane: "true"
    Icp/PointToPlaneK: "10"
    Icp/PointToPlaneRadius: "0"
    Icp/MaxCorrespondenceDistance: "2.0"
    Icp/MaxTranslation: "5.0"
    Icp/Iterations: "30"
    Icp/Epsilon: "0.001"
    # Kept strict on purpose. With 35 m radius and 0.15 here there were 14 loop
    # closures on a 4 lane survey instead of 1, but the SLAM pose got worse than
    # the USBL aided navigation (1.34 m rms against 0.88 m): matches of sparse,
    # noisy multibeam on smooth dunes were pulling it in wrong directions.
    Icp/CorrespondenceRatio: "0.3"
    Icp/OutlierRatio: "0.7"
    # reject the match if the overlapping seabed is too flat to fix all directions
    Icp/PointToPlaneMinComplexity: "0.03"

    # --- map output ---
    Grid/Sensor: "0"
    Grid/3D: "true"
    Grid/CellSize: "0.5"
    Grid/RangeMax: "80"
    Grid/RayTracing: "false"
    Grid/NormalsSegmentation: "false"
    Grid/MaxGroundHeight: "0"
    Grid/MaxObstacleHeight: "0"

    cloud_output_voxelized: true
    cloud_voxel_size: 0.5
